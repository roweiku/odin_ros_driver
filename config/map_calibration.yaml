# Map Calibration Configuration
# 地图坐标系校准配置
#
# This file is used to calibrate the map coordinate system so that
# the "map" frame aligns with the real-world defined map origin.
# 此文件用于校准地图坐标系，使 "map" frame 与现实中定义的地图原点对齐。
#
# Usage / 使用方法:
#   1. Start driver in mode 2, wait for relocalization success
#      以模式2启动驱动，等待重定位成功
#   2. Fill in control_points below with known real-world positions
#      在下方 control_points 中填入已知的真实世界坐标
#   3. Run: python3 script/map_calibration.py
#      运行校准脚本
#   4. Follow the prompts to collect data at each control point
#      按照提示在每个控制点采集数据
#   5. Restart driver to apply calibration
#      重启驱动以应用校准
#
# The script will write measured_points and calibration_result below.
# 脚本会将测量数据和校准结果写入下方。

# ===== Control Points (User Configuration) =====
# 控制点（用户配置）
# Coordinate system: real-world defined map origin (real_map)
# 坐标系：现实中定义的地图坐标系（真实地图原点）
# Format: [x, y, z] in meters / 格式：[x, y, z] 单位：米
# Minimum 3 non-collinear points required / 最少需要 3 个非共线点
control_points:
  - name: "point_1"
    position: [-0.032,-0.045, 0.031]
  - name: "point_2"
    position: [ 5.168, 1.355, 0.031]
  - name: "point_3"
    position: [ 4.848,-2.475, 0.031]
  # - name: "point_4"
  #   position: [ 0.0, 0.0, 0.0]

# ===== Measured Points (Auto-generated by script) =====
# 测量点（由脚本自动生成，请勿手动修改）
# Positions in device map frame via TF lookup (map → odin1_base_link)
# 通过TF查询获取的设备地图坐标系下位置（5秒平均值）
measured_points:
  - name: "point_1"
    position: [0.052445, 2.840710, 0.205040]
  - name: "point_2"
    position: [0.477078, 2.846256, 0.023513]
  - name: "point_3"
    position: [-0.018241, 2.256691, -0.023865]

# ===== Calibration Result (Auto-generated by script) =====
# 校准结果（由脚本自动生成，请勿手动修改）
# T_real_map_device_map: transforms device map positions to real map positions
# P_real_map = T_calibration * P_device_map
calibration_result:
  valid: false # true if calibration successful, false if failed or not run
  # 4x4 transformation matrix (row-major, nested list)
  transform_matrix:
    - [0.9287441370, 0.1921857393, -0.3170157245, -0.3455394292]
    - [-0.0435924206, 0.9058147449, 0.4214253775, -2.6198181525]
    - [0.3681494653, -0.3775768657, 0.8496479751, 0.8790665877]
    - [0.0000000000, 0.0000000000, 0.0000000000, 1.0000000000]
  rmse: 0.19460230
  timestamp: "2026-05-24 14:05:18"
